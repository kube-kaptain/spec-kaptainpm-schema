# Inline encrypted secrets for a run build: one encryptionType for every value,
# keyed by token name.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  data:
    secrets:
      encryptionType: sha256.aes256.100k
      encryptedValues:
        DbPassword: 'YWdlLWVuY3J5cHRpb24ub3JnL3YxCg=='
        Vendor/ApiKey: 'YWdlLWVuY3J5cHRpb24ub3JnL3YxCg=='

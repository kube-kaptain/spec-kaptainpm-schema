# targetIncludeNamespace=false with no targetNamespace at all: valid flat
# registry layout - namespace segment excluded from image URIs.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    docker:
      targetIncludeNamespace: false

#
# artifactReferenceFixed carries the same digest suffix, which is what lets a
# built layerset lock its members to exact bytes rather than to a tag that
# could later be moved.

apiVersion: kaptain.org/1.2
metadata:
  labels:
    kaptain.org/version: "1.0"
    kaptain.org/project-name: "layerset-fixture"
    kaptain.org/owner: "kube-kaptain"
  annotations:
    kaptain.org/built-by: "github-actions"
    kaptain.org/source-repository: "kube-kaptain/layerset-fixture"
    kaptain.org/image-uri: "ghcr.io/kube-kaptain/layerset-fixture:1.0"
spec:
  layers:
    - layer-bare:1.2@sha256:1111111111111111111111111111111111111111111111111111111111111111
    - layer-bracket:[1.2]@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
    - prefix/prefix-name:1.2@sha256:1111111111111111111111111111111111111111111111111111111111111111
    - sub.domain/namespace/my/my-name:1.2@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
    - registry.io:5000/namespace/pre/pre-name:1.2@sha256:1111111111111111111111111111111111111111111111111111111111111111
    - docker|layer-with-provider:1.2@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789

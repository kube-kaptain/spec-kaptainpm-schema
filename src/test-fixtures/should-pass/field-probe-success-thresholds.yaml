#
# successThreshold is 1 on liveness and startup, in either form, and may be
# higher on readiness.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-manifests-only
spec:
  main:
    generators:
      workload:
        probes:
          liveness:
            successThreshold: 1
          startup:
            successThreshold: "1"
          readiness:
            successThreshold: 3

#
# autoGenerateImagePullSecrets is about the workloads the env deploys, not the
# deploy manifests, so it stays allowed when the user supplies those.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      generateIdealEnvironmentDeployManifests: false
      autoGenerateImagePullSecrets: false

#
# replicas: "NO" omits replicas from the generated workload, for when a
# HorizontalPodAutoscaler manages the count.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      workload:
        replicas: 'NO'

# A traditional helm repo source is repoUrl plus chartName.

apiVersion: kaptain.org/1.2
kind: kubernetes-bundle-vendor-helm-rendered
spec:
  main:
    vendorHelmRendered:
      repoUrl: https://charts.example.com
      chartName: my-chart

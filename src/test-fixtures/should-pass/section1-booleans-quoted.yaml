#
# Section 1 boolean fields written in quoted form. The YAML loader keeps these
# as strings, so the oneOf string branch with pattern ^(true|false)$ must
# accept them.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  global:
    tokens:
      allowBuiltinOverride: 'true'
  main:
    docker:
      dockerfile:
        noCache: 'false'

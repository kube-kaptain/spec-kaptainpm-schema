# Either flag of each contradictory pair may be on as long as the other is off.

apiVersion: kaptain.org/1.2
kind: basic-quality-and-versioning
spec:
  main:
    quality:
      branches:
        blockSlashes: true
        requireConventional: false
      commits:
        requireConventional: 'true'
        blockConventional: 'false'

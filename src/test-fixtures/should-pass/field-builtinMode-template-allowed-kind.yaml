#
# builtinMode: template on one of the three kinds that package manifests for
# another build to consume. The root allOf guard must let this through.

apiVersion: kaptain.org/1.2
kind: kubernetes-bundle-resources
spec:
  global:
    tokens:
      builtinMode: template

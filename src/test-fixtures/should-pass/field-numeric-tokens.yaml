# Numeric fields written into generated manifests accept a whole-value token
# in any delimiter style, left for later substitution.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      workload:
        replicas: '${ReplicaCount}'
        revisionHistoryLimit: '{{ RevisionHistoryLimit }}'
        container:
          port: '<%= CONTAINER_PORT %>'
        probes:
          readiness:
            checkType: tcp-socket
            tcpPort: '${{ container-port }}'
            periodSeconds: '<#= ReadinessPeriodSeconds #>'
      statefulset:
        updateStrategy:
          partition: '{{ .Values.partition }}'
      cronjob:
        backoffLimit: '$backoff.limit$'
      job:
        ttlSecondsAfterFinished: '%{JobTtlSeconds}'
      service:
        port: '{{ $service_port }}'
        nodePort: '\(NodePort)'

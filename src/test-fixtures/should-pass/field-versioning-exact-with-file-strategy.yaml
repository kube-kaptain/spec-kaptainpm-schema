#
# useSourceVersionExact with a file-based strategy.

apiVersion: kaptain.org/1.2
kind: basic-quality-and-versioning
spec:
  global:
    release:
      versioning:
        strategy: file-pattern-match
        useSourceVersionExact: 'true'

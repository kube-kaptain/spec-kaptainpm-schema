apiVersion: kaptain.org/1.2
kind: kubernetes-app-manifests-only
spec:
  main:
    generators:
      namespace:
        enabled: true
        nameSuffix: '-tools'
        additionalLabels: 'tier=tools'
        additionalAnnotations: 'owner=platform-team'

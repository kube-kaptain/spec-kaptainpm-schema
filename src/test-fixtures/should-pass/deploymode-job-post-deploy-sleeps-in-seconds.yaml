#
# Unit-less job-mode post-deploy sleeps are seconds: a bare integer or a
# digit string.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      deployMode: job
      jobPostDeploySleepAfterSuccess: 600
      jobPostDeploySleepAfterFailure: "86400"

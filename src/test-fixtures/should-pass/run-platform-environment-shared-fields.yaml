#
# Both run kinds configure spec.main.environment. A run-platform may set the
# fields shared by both kinds, and its own namespace oversight in cleanUp.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-platform-meta-environment
spec:
  main:
    environment:
      deployMode: deployment
      cleanUp:
        policy: dryrun
        undeclaredNamespacePolicy: dryrun

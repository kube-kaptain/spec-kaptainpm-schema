# cleanUp count accepts the string form like the other numbers.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      cleanUp:
        accumulatingResources:
          jobs:
            type: count
            count: '3'

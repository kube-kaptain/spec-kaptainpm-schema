#
# Namespace oversight is run-platform only: a run-environment build may not
# set cleanUp.undeclaredNamespacePolicy.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      cleanUp:
        undeclaredNamespacePolicy: dryrun

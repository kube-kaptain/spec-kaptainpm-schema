# Per-field bucket 1 check: statefulset updateStrategy.partition must reject negatives.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      statefulset:
        updateStrategy:
          partition: '-1'

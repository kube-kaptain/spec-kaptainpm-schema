#
# Whole numbers given as strings have no leading zeros: '01' could be read as
# octal or break arithmetic once it reaches a manifest or the build.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      workload:
        revisionHistoryLimit: '01'

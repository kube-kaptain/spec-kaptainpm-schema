# Whitespace around the range separator is rejected by the schema. Note that version_resolve_range in the build scripts strips it, so the scripts are more permissive here than the spec.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  contents:
    - "bundle-foo:[1.0, 2.0)"

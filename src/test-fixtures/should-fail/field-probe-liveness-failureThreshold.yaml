# Per-field bucket 2 check: probe liveness failureThreshold must reject zero.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      workload:
        probes:
          liveness:
            failureThreshold: '0'

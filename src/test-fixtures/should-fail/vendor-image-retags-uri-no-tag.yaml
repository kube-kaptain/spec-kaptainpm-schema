#
# sourceImageUri must carry a tag; a registry port is not a tag.

apiVersion: kaptain.org/1.2
kind: kubernetes-bundle-vendor-helm-rendered
spec:
  main:
    vendorHelmRendered:
      ociChart: oci://ghcr.io/example/charts/my-chart
      imageRetags:
        - sourceImageUri: 'registry.example.com:5000/team/app'
          tagSuffix: app

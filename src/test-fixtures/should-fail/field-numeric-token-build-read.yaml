# Numeric settings the build reads itself take no tokens: nothing would
# substitute them before the build needs the value.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  global:
    release:
      versioning:
        maxParts: '${MaxParts}'

#
# imageAutoUpdatePollSchedule must be at least 1 of its unit: @every 0m is not a
# usable poll interval.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      imageAutoUpdateProvider: keelson
      imageAutoUpdatePolicy: patch
      imageAutoUpdateTrigger: poll
      imageAutoUpdatePollSchedule: 0m

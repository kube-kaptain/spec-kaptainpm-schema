#
# imageDeployManifestsApplyMode is environment-only: run-platforms deploy
# themselves, so it is rejected on a run-platform.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-platform-meta-environment
spec:
  main:
    environment:
      imageDeployManifestsApplyMode: seed-and-compare

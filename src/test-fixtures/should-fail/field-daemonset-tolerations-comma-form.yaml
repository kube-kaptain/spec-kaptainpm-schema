#
# daemonset.tolerations must be a JSON array, same as the workload scheduling
# field. Covered separately because the two are independent schema nodes and
# the daemonset pair was the one missed when this format was first documented.
# One bad value only, so the rejection can only be this field.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      daemonset:
        tolerations: 'key=node-role.kubernetes.io/control-plane,effect=NoSchedule'

# Per-field bucket 2 check: probe readiness successThreshold must reject zero.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      workload:
        probes:
          readiness:
            successThreshold: '0'

#
# Digest on a range. A digest names one artifact, so there is nothing for the range to resolve.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  contents:
    - "bundle-foo:[1.0,2.0)@sha256:1111111111111111111111111111111111111111111111111111111111111111"

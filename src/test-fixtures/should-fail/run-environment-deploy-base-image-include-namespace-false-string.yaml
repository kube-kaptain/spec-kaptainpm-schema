#
# The string 'false' for includeNamespace contradicts a non-empty namespace
# just as the boolean does.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      environmentDeployBaseImage:
        includeNamespace: 'false'
        namespace: kube-kaptain

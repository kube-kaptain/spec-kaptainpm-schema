# The separate-field form requires sourceRegistry, sourceImageName and
# sourceTag.

apiVersion: kaptain.org/1.2
kind: kubernetes-bundle-vendor-helm-rendered
spec:
  main:
    vendorHelmRendered:
      ociChart: oci://ghcr.io/example/charts/my-chart
      imageRetags:
        - sourceRegistry: docker.io
          sourceNamespace: envoyproxy
          sourceImageName: ratelimit
          tagSuffix: ratelimit

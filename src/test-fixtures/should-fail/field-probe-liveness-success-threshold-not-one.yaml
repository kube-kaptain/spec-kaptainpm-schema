#
# Kubernetes requires successThreshold to be 1 on a liveness probe.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-manifests-only
spec:
  main:
    generators:
      workload:
        probes:
          liveness:
            successThreshold: 3

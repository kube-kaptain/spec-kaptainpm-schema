# Digest written inside the fixed bracket. The brackets are Maven set notation and a digest is not part of a version, so the digest goes after the closing bracket.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  contents:
    - "bundle-foo:[1.2@sha256:1111111111111111111111111111111111111111111111111111111111111111]"

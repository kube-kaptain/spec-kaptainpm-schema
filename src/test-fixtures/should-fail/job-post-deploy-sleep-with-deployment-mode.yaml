#
# A job-mode post-deploy sleep with deployMode deployment must be rejected:
# a deployment never exits, so there is nothing to sleep before.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      deployMode: deployment
      jobPostDeploySleepAfterSuccess: 10m

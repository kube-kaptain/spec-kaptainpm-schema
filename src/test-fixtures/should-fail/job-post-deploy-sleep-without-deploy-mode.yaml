#
# A job-mode post-deploy sleep needs an explicit deployMode job; the
# default mode is deployment.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      jobPostDeploySleepAfterFailure: 24h

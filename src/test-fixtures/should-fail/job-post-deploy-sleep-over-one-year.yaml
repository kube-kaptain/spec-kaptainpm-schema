#
# A job-mode post-deploy sleep longer than a year (365 days) is rejected.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      deployMode: job
      jobPostDeploySleepAfterFailure: 366d

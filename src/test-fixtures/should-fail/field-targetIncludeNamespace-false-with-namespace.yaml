#
# targetIncludeNamespace=false contradicts a non-empty targetNamespace: the
# combination is rejected at validation in every variant. A layer-contributed
# namespace conflicting with a project-level false is resolved by setting
# targetNamespace "" explicitly in the project file.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    docker:
      targetIncludeNamespace: false
      targetNamespace: kube-kaptain

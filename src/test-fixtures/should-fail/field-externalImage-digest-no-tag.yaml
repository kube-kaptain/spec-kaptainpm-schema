# externalImage.digest requires a tag: the digest is verified against it.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-manifests-only
spec:
  main:
    externalImage:
      name: my-org/my-app
      digest: 'sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

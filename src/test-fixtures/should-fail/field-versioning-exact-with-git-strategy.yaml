#
# useSourceVersionExact works only with the file-based strategies, never with
# git-auto-closest-highest.

apiVersion: kaptain.org/1.2
kind: basic-quality-and-versioning
spec:
  global:
    release:
      versioning:
        strategy: git-auto-closest-highest
        useSourceVersionExact: true

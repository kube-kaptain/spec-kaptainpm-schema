#
# builtinMode on an allowed kind but with a value outside the enum. Rejected by
# the property definition rather than the root allOf guard.

apiVersion: kaptain.org/1.2
kind: kubernetes-bundle-resources
spec:
  global:
    tokens:
      builtinMode: defer

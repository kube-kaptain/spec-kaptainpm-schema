#
# Conventional branch names start with a prefix such as feature/, so blocking
# slashes and requiring conventional names together can never pass.

apiVersion: kaptain.org/1.2
kind: basic-quality-and-versioning
spec:
  main:
    quality:
      branches:
        blockSlashes: true
        requireConventional: true

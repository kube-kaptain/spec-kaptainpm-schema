#
# Section 1 boolean field given as quoted 'yes'. The string is preserved by the
# YAML loader, then the oneOf string branch's ^(true|false)$ pattern must
# reject it. Both oneOf branches must fail for validation to fail overall.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  global:
    release:
      versioning:
        useSourceVersionExact: 'yes'

# A cleanup age must be at least 1 of its unit.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  main:
    environment:
      cleanUp:
        accumulatingResources:
          configmaps:
            type: age
            age: 0d

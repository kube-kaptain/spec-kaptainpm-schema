#
# workload imagePullSecrets is ENABLED or DISABLED. The build treats anything
# other than DISABLED as enabled, so a lowercase typo would do the opposite of
# what was meant.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      workload:
        security:
          imagePullSecrets: disabled

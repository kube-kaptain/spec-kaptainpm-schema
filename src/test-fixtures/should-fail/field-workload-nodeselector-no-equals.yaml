#
# workload.scheduling.nodeSelector must be comma-separated key=value pairs. A
# bare label key with no value has nothing to split on and would generate a
# selector entry with an empty key. One bad value only, so the rejection can
# only be this field.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      workload:
        scheduling:
          nodeSelector: 'tier'

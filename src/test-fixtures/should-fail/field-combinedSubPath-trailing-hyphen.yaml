#
# A combinedSubPath segment ending in - would leave the generated resource
# name ending in -, which Kubernetes rejects.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      configmap:
        combinedSubPath: tools-

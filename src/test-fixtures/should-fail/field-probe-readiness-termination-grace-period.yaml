#
# Kubernetes allows a probe-level terminationGracePeriodSeconds on liveness
# and startup probes only; it is rejected on a readiness probe.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-manifests-only
spec:
  main:
    generators:
      workload:
        probes:
          readiness:
            terminationGracePeriodSeconds: "30"

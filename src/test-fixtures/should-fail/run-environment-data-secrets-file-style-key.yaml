#
# encryptedValues keys are token names; the type goes in encryptionType, not in
# a file-style suffix on the key.

apiVersion: kaptain.org/1.2
kind: kubernetes-run-environment
spec:
  data:
    secrets:
      encryptionType: age
      encryptedValues:
        DbPassword.age: 'YWdlLWVuY3J5cHRpb24ub3JnL3YxCg=='

#
# Digest hex is upper case. OCI digests are lower case, and a case-insensitive match would let two spellings name one artifact.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  contents:
    - bundle-foo:1.2@sha256:ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789

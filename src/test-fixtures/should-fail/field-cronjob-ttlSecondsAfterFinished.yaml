# Per-field bucket 1 check: cronjob ttlSecondsAfterFinished must reject negatives.

apiVersion: kaptain.org/1.2
kind: kubernetes-app-docker-dockerfile
spec:
  main:
    generators:
      cronjob:
        ttlSecondsAfterFinished: '-1'

#
# KaptainPM schema source - superset of all five output schemas.
#
# This file is NOT published directly. The generate-kind-schemas.bash hook
# transforms it into five output schemas during build:
#
#   spec-kaptainpm-schema.yaml                    Base            - project root KaptainPM.yaml
#   spec-kaptainpm-schema-final.yaml              Final           - kaptainpm/final/KaptainPM.yaml after layer merge
#   spec-kaptainpm-schema-layer.yaml              Layer           - layer image KaptainPM.yaml files
#   spec-kaptainpm-schema-layerset.yaml           Layerset        - built/published layerset (pinned versions, metadata required)
#   spec-kaptainpm-schema-layerset-source.yaml    Layerset Source - source layerset before build (ranges allowed, metadata optional)
#
# Structural differences from this source:
#   Base            minus layer-payload (kind required, inherited from source)
#   Final           like Base (kind required, inherited from source)
#   Layer Source    minus spec.layers (config layers cannot compose other layers); kind made optional
#   Layer           like Layer Source but metadata.labels and metadata.annotations required; kind made optional
#   Layerset        like Layerset Source but artifactReferenceFixed (no ranges); metadata.labels and metadata.annotations required; kind made optional
#   Layerset Source minus layer-payload; minus user-data; spec reduced to spec.layers only; kind made optional
#
# Token substitution: ${Version} and ${ProjectName} are replaced at build time.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/kube-kaptain/${ProjectName}/releases/download/${Version}/${ProjectName}-layer-${Version}.yaml"

name: ${ProjectName}
version: "${Version}"
source: https://github.com/kube-kaptain/${ProjectName}
latest: https://raw.githubusercontent.com/kube-kaptain/${ProjectName}/main/${ProjectName}.yaml
tagged: https://raw.githubusercontent.com/kube-kaptain/${ProjectName}/${Version}/${ProjectName}.yaml
release: https://github.com/kube-kaptain/${ProjectName}/releases/download/${Version}/${ProjectName}-layer-${Version}.yaml
validate-using: https://github.com/kube-kaptain/${ProjectName}/releases/download/${Version}/${ProjectName}-layer-${Version}.json

title: KaptainPM
description: >
  Kaptain project manifest schema (version ${Version}).
type: object
required:
  - apiVersion
  - kind
additionalProperties: false
properties:

  apiVersion:
    type: string
    pattern: "^kaptain\\.org/[0-9]+(\\.[0-9]+)*$"
    description: >
      API version - must be kaptain.org/ followed by the schema version
      (e.g. kaptain.org/1.2). Set via ${Version} token substitution at
      build time.

  kind:
    type: string
    description: >
      Build process name matching the workflow/reference script used
      (e.g. kubernetes-app-docker-dockerfile). Kebab-case, exact equality
      check against the build wrapper's BUILD_KIND. Mismatch is an
      immediate failure in the preamble.

  metadata:
    type: object
    additionalProperties: true
    description: >
      Project metadata including build traceability labels and annotations.
      When present, label and annotation values must be strings.
    properties:
      description:
        type: string
        description: Human-readable project description.
      labels:
        type: object
        additionalProperties:
          type: string
        description: Queryable build metadata labels. All values must be strings.
      annotations:
        type: object
        additionalProperties:
          type: string
        description: Informational build metadata annotations. All values must be strings.

  user-data:
    type: object
    description: >
      Free-form custom data for layer-provided tools. No enforced schema.
      Deep merged like any other map field - layers provide defaults,
      local overrides win.

  spec:
    type: object
    additionalProperties: false
    description: Build configuration
    properties:

      credentials:
        $ref: "#/$defs/credentials"

      layers:
        $ref: "#/$defs/artifactReferenceList"
        description: >
          Configuration layers applied before this project's settings.
          Deep-merged in order; local settings always win. Bootstrap
          registry logins must be in the project root file (needed before
          layer resolution). Additional logins declared in layers are
          applied in a second login phase post-merge.

      templates:
        $ref: "#/$defs/artifactReferenceList"
        description: >
          Manifest template sets pulled in and token-substituted to become
          this project's own manifest output. Replaces generators or
          hand-written manifests.

      contents:
        $ref: "#/$defs/artifactReferenceList"
        description: >
          Finished manifest artifacts from other projects bundled into
          this deliverable. Front and centre in product/environment builds.

      data:
        $ref: "#/$defs/specData"

      global:
        $ref: "#/$defs/specGlobal"

      main:
        $ref: "#/$defs/specMain"

      platform:
        $ref: "#/$defs/specPlatform"

  # layer-payload is a layer-only top-level field.
  # The hook removes it from the Project and Final schemas.
  layer-payload:
    $ref: "#/$defs/layerPayload"

# Kind-driven section gating for spec.main.
#
# Source-level rules - apply to Base (in-repo) and Final (which inherit them):
#   - kind == kubernetes-run-environment              -> spec.main.environment is required;
#                                                         spec.main.runPlatform is forbidden.
#   - kind == kubernetes-run-platform-meta-environment -> spec.main.runPlatform is required;
#                                                         spec.main.environment is forbidden.
#   - any other kind                                  -> both blocks are forbidden.
#
# Layer / Layer Source: the hook strips these rules and replaces them with a
#   simple mutex (environment XOR runPlatform - either or neither, never both),
#   because layers may serve any/all build kinds and the kind discriminator
#   does not apply at the layer level.
#
# Layerset / Layerset Source: the hook strips these rules entirely; layersets
#   only have spec.layers, so spec.main does not exist.
#
# There is exactly ONE top-level allOf - JSON Schema allows no more, and a
# second key silently produces an unparseable duplicate-key document. Rules
# unrelated to the kind gating live here too, tagged with $comment so the hook
# can keep them while stripping the gating entries.
allOf:
  # tokens.builtinMode only means anything in the flows that package manifests
  # for another build to consume, so every other kind is held to the default -
  # stating it is fine, turning it on is not. The guard is skipped when kind is
  # absent, which is how layers and layersets can carry the setting for a family
  # of template projects; the merged final has kind required, so misuse is
  # caught there. Survives the hook's layer/layerset rewrites via its $comment.
  - $comment: builtin-mode-guard
    if:
      required: [kind]
      properties:
        kind:
          not:
            enum:
              - kubernetes-app-manifests-only
              - kubernetes-bundle-resources
              - kubernetes-bundle-vendor-helm-rendered
    then:
      properties:
        spec:
          properties:
            global:
              properties:
                tokens:
                  properties:
                    builtinMode:
                      const: standard
  - if:
      required: [kind]
      properties:
        kind:
          const: kubernetes-run-environment
    then:
      properties:
        spec:
          properties:
            main:
              required: [environment]
              not:
                required: [runPlatform]
  - if:
      required: [kind]
      properties:
        kind:
          const: kubernetes-run-platform-meta-environment
    then:
      properties:
        spec:
          properties:
            main:
              required: [runPlatform]
              not:
                required: [environment]
  - if:
      required: [kind]
      not:
        properties:
          kind:
            enum:
              - kubernetes-run-environment
              - kubernetes-run-platform-meta-environment
    then:
      properties:
        spec:
          properties:
            main:
              not:
                anyOf:
                  - required: [environment]
                  - required: [runPlatform]

$defs:

  # ---------------------------------------------------------------------------
  # layer-payload - layer image additional file manifest (layer-only field)
  # ---------------------------------------------------------------------------

  layerPayload:
    type: array
    description: >
      Additional files the layer image carries alongside KaptainPM.yaml.
      Layer-only - the unknown-key validator rejects this in project root files.
    items:
      $ref: "#/$defs/layerPayloadItem"

  layerPayloadItem:
    type: object
    additionalProperties: false
    required:
      - source
      - destination
    description: A file or directory entry in the layer image to be extracted
    properties:
      source:
        type: string
        description: >
          Absolute path of the file or directory inside the image from
          container root (e.g. /scripts/build.bash)
      destination:
        type: string
        description: >
          Relative directory path from repo root where contents land.
          mkdir -p is run before any copy or unpack operation.
          (e.g. .kaptain/scripts/)
      unpack:
        type: string
        enum:
          - tar.gz
          - tar.bz2
          - tar.xz
          - tar
          - zip
          - gz
          - bz2
          - xz
        description: >
          Archive format for unpacking. Absent means plain copy.
          Invalid on directory sources.

  # ---------------------------------------------------------------------------
  # spec.credentials
  # ---------------------------------------------------------------------------

  credentials:
    type: array
    description: >
      Build-time credential names. Names only - values are sourced from
      the platform (GitHub Actions secrets, local files, etc.). Validated
      early in the preamble; fails immediately if any declared credential
      is unavailable. Must be complete in the project root file before
      the wrapper can expose any secrets (runtime enforcement, not schema).
    items:
      type: string
      pattern: "^[A-Z][A-Z0-9_]*$"
      description: Credential name as an uppercase env var name

  # ---------------------------------------------------------------------------
  # Artifact reference types
  # ---------------------------------------------------------------------------

  artifactReferenceList:
    type: array
    items:
      $ref: "#/$defs/artifactReference"

  artifactReference:
    description: >
      Artifact reference. Three forms are supported:
        Short    name:version              (default registry and namespace)
        Prefixed prefix/name:version       (default registry, explicit namespace)
        Full     domain/path/name:version  (explicit registry - first segment contains a dot)
      Version is one of: an exact version (one or more dot-separated integers,
      optional -PRERELEASE suffix); a Maven-style fixed bracket form pinning
      that exact version (e.g. [1.0.1]); or a Maven-style range
      (e.g. [1.0,2.0), (1.0,), (,2.0]).
    oneOf:
      - description: "Short form: name:version-or-range"
        type: string
        pattern: "^[a-z][a-z0-9-]*:([0-9]+(\\.[0-9]+)*(-PRERELEASE)?|\\[[0-9]+(\\.[0-9]+)*(-PRERELEASE)?\\]|[\\[\\(][0-9]*(\\.[0-9]+)*,[0-9]*(\\.[0-9]+)*[\\]\\)])$"
      - description: "Prefixed form: prefix/prefix-name:version-or-range"
        type: string
        pattern: "^[a-z][a-z0-9-]*/[a-z][a-z0-9-]*:([0-9]+(\\.[0-9]+)*(-PRERELEASE)?|\\[[0-9]+(\\.[0-9]+)*(-PRERELEASE)?\\]|[\\[\\(][0-9]*(\\.[0-9]+)*,[0-9]*(\\.[0-9]+)*[\\]\\)])$"
      - description: "Full form: sub.domain/namespace/my/my-name:version-or-range (first segment contains a dot)"
        type: string
        pattern: "^[a-z0-9][a-z0-9.-]*\\.[a-z]{2,}(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+:([0-9]+(\\.[0-9]+)*(-PRERELEASE)?|\\[[0-9]+(\\.[0-9]+)*(-PRERELEASE)?\\]|[\\[\\(][0-9]*(\\.[0-9]+)*,[0-9]*(\\.[0-9]+)*[\\]\\)])$"

  artifactReferenceFixedList:
    type: array
    items:
      $ref: "#/$defs/artifactReferenceFixed"

  artifactReferenceFixed:
    description: >
      Artifact reference with a pinned exact version (no ranges allowed).
      Used in resolved/built artifacts where all versions must be concrete.
      Same three forms as artifactReference. Version must be exact, written
      either bare (1.0.1) or in Maven-style fixed bracket form ([1.0.1]).
    oneOf:
      - description: "Short form: name:version"
        type: string
        pattern: "^[a-z][a-z0-9-]*:([0-9]+(\\.[0-9]+)*(-PRERELEASE)?|\\[[0-9]+(\\.[0-9]+)*(-PRERELEASE)?\\])$"
      - description: "Prefixed form: prefix/prefix-name:version"
        type: string
        pattern: "^[a-z][a-z0-9-]*/[a-z][a-z0-9-]*:([0-9]+(\\.[0-9]+)*(-PRERELEASE)?|\\[[0-9]+(\\.[0-9]+)*(-PRERELEASE)?\\])$"
      - description: "Full form: sub.domain/namespace/my/my-name:version (first segment contains a dot)"
        type: string
        pattern: "^[a-z0-9][a-z0-9.-]*\\.[a-z]{2,}(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+:([0-9]+(\\.[0-9]+)*(-PRERELEASE)?|\\[[0-9]+(\\.[0-9]+)*(-PRERELEASE)?\\])$"

  # ---------------------------------------------------------------------------
  # spec.data
  # ---------------------------------------------------------------------------

  specData:
    type: object
    additionalProperties: false
    description: Content that feeds into built artifacts
    properties:
      config:
        type: object
        description: >
          Token values for all manifests. Field names are token names, field
          values are token values. Must not duplicate names declared in
          global.configSubPath files.
        additionalProperties:
          type: string
      secrets:
        type: object
        description: >
          Token values for k8s Secret manifest contents only. Applied last,
          after config substitution.
        additionalProperties:
          type: string

  # ---------------------------------------------------------------------------
  # spec.global
  # ---------------------------------------------------------------------------

  specGlobal:
    type: object
    additionalProperties: false
    description: Shared settings used across all pipeline stages
    properties:
      outputSubPath:
        type: string
        description: 'Build output directory (default: kaptain-out)'
      configSubPath:
        type: string
        description: 'Directory with user-defined token files (default: src/config)'
      secretsSubPath:
        type: string
        description: 'Directory with user-defined secret files (default: src/secrets)'
      projectName:
        type: object
        additionalProperties: false
        description: Project name derivation from repository name
        properties:
          stripRepositoryNamePrefix:
            type: string
            pattern: "^[a-z0-9]+([a-z0-9-]*[a-z0-9]+)?$"
            description: >
              WARNING: Do not use this configuration unless you have an
              isolated cluster set or other runtime as it means you could
              get project name collisions if a repo is named the same
              without the prefix or has a different prefix with that
              prefix stripped.

              Prefix to strip from repository name to derive project
              name. The prefix and its trailing hyphen are removed. For
              example, if the repository is teamname-api-user-service
              and this is set to teamname, the project name becomes
              api-user-service.
      tokens:
        type: object
        additionalProperties: false
        description: Token substitution configuration
        properties:
          delimiterStyle:
            type: string
            enum:
              - shell
              - mustache
              - helm
              - double-curly
              - at-sign
              - dollar-sign
              - percent
              - hash
              - xml
              - erb
              - github-actions
              - blade
              - stringtemplate
              - ognl
              - t4
              - swift
            description: 'Token syntax style (default: shell)'
          nameStyle:
            type: string
            enum:
              - PascalCase
              - camelCase
              - UPPER_SNAKE
              - lower_snake
              - lower-kebab
              - UPPER-KEBAB
              - lower.dot
              - UPPER.DOT
            description: 'Token name casing convention (default: PascalCase)'
          nameValidation:
            type: string
            enum:
              - MATCH
              - ALL
            description: >
              MATCH enforces the nameStyle, ALL accepts any casing (default: MATCH)
          builtinMode:
            type: string
            enum:
              - standard
              - template
            description: >
              standard substitutes built-in tokens with this build's own values.
              template leaves them unsubstituted for the consuming build and
              emits this build's values under an Original prefix instead, so
              ProjectName is the consumer's and OriginalProjectName is the
              producer's. Only valid for the kinds that package manifests for
              another build to consume (default: standard)
          substitutionPasses:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                pattern: "^[1-9][0-9]*$"
            description: 'Number of token substitution passes (default: 1)'
          valueTrailingNewline:
            type: string
            enum:
              - strip-for-single-line
              - preserve-all
              - always-strip-one-newline
            description: 'Trailing newline handling for token values (default: strip-for-single-line)'
      release:
        type: object
        additionalProperties: false
        description: Versioning and release branch configuration
        properties:
          branch:
            type: string
            description: 'Primary release branch (default: main)'
          additionalBranches:
            type: string
            description: Comma-separated additional release branches
          versioning:
            type: object
            additionalProperties: false
            properties:
              maxParts:
                oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: "^[1-9][0-9]*$"
                description: 'Maximum version parts allowed before failure (default: 3)'
              strategy:
                type: string
                enum:
                  - git-auto-closest-highest
                  - file-pattern-match
                  - compound-file-pattern-match
                description: 'Version calculation strategy (default: git-auto-closest-highest)'
              patternType:
                type: string
                enum:
                  - dockerfile-env-kubectl
                  - retag-workflow-source-tag
                  - custom
                description: 'Pattern type for file-pattern-match strategies'
              useSourceVersionExact:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Use the source version exactly without incrementing (default: false)'
              source:
                type: object
                additionalProperties: false
                description: Primary version source file configuration
                properties:
                  subPath:
                    type: string
                    description: 'Override path to source directory'
                  fileName:
                    type: string
                    description: 'Override source file name'
                  pattern:
                    type: string
                    description: 'Regex with capture group for custom pattern type'
                  prefixParts:
                    oneOf:
                      - type: integer
                        minimum: 1
                      - type: string
                        pattern: "^[1-9][0-9]*$"
                    description: 'Parts from source as prefix (output = prefix + 1)'
              sourceTwo:
                type: object
                additionalProperties: false
                description: Secondary version source file configuration (compound strategies)
                properties:
                  subPath:
                    type: string
                    description: 'Override path to secondary source directory'
                  fileName:
                    type: string
                    description: 'Override secondary source file name'
                  pattern:
                    type: string
                    description: 'Regex with capture group for secondary source'
                  prefixParts:
                    oneOf:
                      - type: integer
                        minimum: 1
                      - type: string
                        pattern: "^[1-9][0-9]*$"
                    description: 'Parts from secondary source as prefix'

  # ---------------------------------------------------------------------------
  # spec.platform
  # ---------------------------------------------------------------------------

  specPlatform:
    type: object
    additionalProperties: false
    description: Platform-specific build configuration
    properties:
      githubActions:
        type: object
        additionalProperties: false
        description: GitHub Actions-specific configuration
        properties:
          release:
            type: object
            additionalProperties: false
            description: GitHub Releases configuration
            properties:
              enabled:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Create a GitHub Release on version tags (default: true)'
              addVersionToFilenames:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Add version suffix to release artifact filenames (default: true)'
              notes:
                type: string
                description: Inline release notes (mutually exclusive with notesFile)
              notesFile:
                type: string
                description: Path to a file containing release notes (mutually exclusive with notes)
              substitutedFiles:
                type: string
                description: Comma-separated files to token-substitute before attaching to the release
              verbatimFiles:
                type: string
                description: Comma-separated files to attach to the release as-is
              consumerReferenceForms:
                type: string
                enum:
                  - short-only
                  - short-first
                  - full-first
                  - full-only
                description: >
                  Which references the "How to Consume" section of the release
                  notes shows, and in which order. Four values:
                    short-only   org-local reference alone (default)
                    short-first  both, org-local reference first
                    full-first   both, fully qualified reference first
                    full-only    fully qualified reference alone
                  The short form resolves against the consumer's own registry
                  and namespace defaults, so it only reaches this org. The full
                  form carries registry, namespace, prefix and name, and works
                  from any org, registry or platform. Private in-house projects
                  want the default; open source projects want full-first;
                  vendor packages consumed only from other orgs want full-only.

  # ---------------------------------------------------------------------------
  # spec.main
  # ---------------------------------------------------------------------------

  specMain:
    type: object
    additionalProperties: false
    description: Pipeline stage configuration
    properties:

      quality:
        type: object
        additionalProperties: false
        description: Branch and commit naming enforcement
        properties:
          branches:
            type: object
            additionalProperties: false
            properties:
              blockSlashes:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Reject branch names containing forward slashes
              blockDoubleHyphens:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Reject branch names containing double hyphens
              requireConventional:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Require conventional branch naming convention
          commits:
            type: object
            additionalProperties: false
            properties:
              requireConventional:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Require conventional commit message format
              blockConventional:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Block conventional commit message format
              blockDuplicateMessages:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Block duplicate commit messages in a PR

      docker:
        type: object
        additionalProperties: false
        description: Container image build and retag configuration
        # targetIncludeNamespace=false contradicts a non-empty targetNamespace;
        # rejected in every variant, including the layer-merged final - a
        # project consuming a namespace-setting layer with the flag off must
        # resolve the conflict explicitly by setting targetNamespace: "" in
        # the project file (which overrides the layer's value in the merge).
        allOf:
          - if:
              properties:
                targetIncludeNamespace:
                  const: false
              required: [targetIncludeNamespace]
            then:
              properties:
                targetNamespace:
                  const: ""
        properties:
          runtime:
            type: string
            enum: [podman, docker]
            description: >
              Container runtime override. When omitted, auto-detected:
              build_server requires podman, local prefers podman but accepts
              docker. validate-tooling checks availability and creates a
              docker->podman symlink when podman is the runtime.
          platform:
            type: string
            description: >
              Docker build platform(s). Single value or comma-separated for
              multi-platform manifest list (e.g. linux/amd64,linux/arm64).
              Default: linux/amd64
          logins:
            type: object
            description: Registry login configuration keyed by domain
            propertyNames:
              $ref: "#/$defs/registryDomain"
            additionalProperties:
              $ref: "#/$defs/registryLogin"
          targetRegistry:
            $ref: "#/$defs/registryDomain"
            description: Target registry domain for built images
          targetAllowNoRegistry:
            type: boolean
            description: >
              Exempt this project from the load-time target registry check on
              platforms that provide no registry default. Default false.
              basic-quality-checks builds never require a registry; every
              other build kind fails at load when no registry is configured
              or platform-provided, unless this is true. Docker operations
              (including in hooks) will still fail without a registry -
              setting this owns that risk.
          targetNamespace:
            anyOf:
              - $ref: "#/$defs/registryNamespace"
              - const: ""
            description: >
              Target namespace/organisation for built images. Supports nested
              paths, but no leading/trailing slashes. Empty string is treated
              as not configured.
          targetIncludeNamespace:
            type: boolean
            description: >
              Include the namespace segment in built image URIs and
              short-form reference expansion. Default true. Set false for
              flat registry layouts: platform-injected namespace defaults are
              disregarded, and a non-empty targetNamespace alongside false is
              rejected by schema - in every variant, so a layer-contributed
              namespace must be overridden with an explicit targetNamespace ""
              in the project file. Layer resolution reads this from the
              project file only - layers cannot influence the namespace used
              to fetch the layers themselves.
          pushTargets:
            type: array
            description: Additional registries to push the built image to
            items:
              $ref: "#/$defs/pushTarget"
          dockerfile:
            type: object
            additionalProperties: false
            description: Dockerfile build configuration
            properties:
              substitutionFiles:
                type: string
                description: 'Files to perform token substitution on (default: Dockerfile)'
              subPath:
                type: string
                description: 'Directory containing the Dockerfile (default: src/docker)'
              subPathLinuxAmd64:
                type: string
                description: 'Platform-specific Dockerfile directory for linux/amd64 (default: src/docker-linux-amd64)'
              subPathLinuxArm64:
                type: string
                description: 'Platform-specific Dockerfile directory for linux/arm64 (default: src/docker-linux-arm64)'
              squash:
                type: string
                description: 'Squash image layers (podman only, default: squash)'
              noCache:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Disable docker build cache (default: true)'
          retag:
            type: object
            additionalProperties: false
            description: Retag an upstream image rather than building from a Dockerfile
            properties:
              sourceRegistry:
                $ref: "#/$defs/registryDomain"
                description: 'Source registry domain (default: docker.io)'
              sourceNamespace:
                $ref: "#/$defs/registryNamespace"
                description: >
                  Source namespace/organisation. Supports nested paths, but
                  no leading/trailing slashes.
              sourceImageName:
                type: string
                description: Source image name
              sourceTag:
                type: string
                description: Source image tag

      externalImage:
        type: object
        additionalProperties: false
        description: External image reference for manifests-only workflows (no docker build)
        properties:
          name:
            type: string
            description: Docker image name (if provided, substitutes into manifests; if empty, token remains for later substitution)
          tag:
            type: string
            description: Docker image tag (if provided, substitutes into manifests; if empty, token remains for later substitution)

      generators:
        type: object
        additionalProperties: false
        description: Kubernetes manifest generators
        properties:
          common:
            type: object
            additionalProperties: false
            description: Labels and annotations applied to all generated manifests
            properties:
              additionalLabels:
                type: string
                description: Additional labels for all generated manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for all generated manifests

          workload:
            type: object
            additionalProperties: false
            description: >
              Shared workload configuration. workload.type selects which
              type-specific sibling section applies.
            properties:
              type:
                type: string
                enum: [deployment, statefulset, daemonset, cronjob, job, none]
                description: 'Workload type (default: deployment)'
              replicas:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Desired replica count'
              revisionHistoryLimit:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Number of old ReplicaSets to retain (default: 10)'
              minReadySeconds:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Minimum seconds a pod must be ready (default: 0)'
              nameSuffix:
                type: string
                description: Suffix appended to generated workload name
              combinedSubPath:
                type: string
                description: Combined sub-path for workload manifests
              envSubPath:
                type: string
                description: Sub-path for workload environment files
              additionalLabels:
                type: string
                description: Additional labels for workload manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for workload manifests
              container:
                type: object
                additionalProperties: false
                properties:
                  port:
                    oneOf:
                      - type: integer
                        minimum: 1
                        maximum: 65535
                      - type: string
                        pattern: "^([1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
                    description: 'Primary container port (default: 1024)'
                  command:
                    type: string
                    description: Container command override
                  args:
                    type: string
                    description: Container args override
                  imageReferenceStyle:
                    type: string
                    enum: [combined, separate, project-name-prefixed-combined, project-name-prefixed-separate]
                    description: 'Image reference style (default: combined)'
                  readonlyRootFilesystem:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Mount root filesystem read-only (default: true)'
                  resources:
                    type: object
                    additionalProperties: false
                    properties:
                      memory:
                        type: string
                        description: 'Memory request and limit (default: 10Mi)'
                      cpuRequest:
                        type: string
                        description: 'CPU request (default: 100m)'
                      cpuLimit:
                        type: string
                        description: CPU limit (omitted by default)
                      ephemeralStorage:
                        type: string
                        description: 'Ephemeral storage request and limit (default: 60Mi)'
                  mounts:
                    type: object
                    additionalProperties: false
                    properties:
                      configmap:
                        type: object
                        additionalProperties: false
                        properties:
                          path:
                            type: string
                            description: 'ConfigMap mount path (default: /configmap)'
                          keysForEnv:
                            type: string
                            description: ConfigMap keys to expose as env vars
                      secret:
                        type: object
                        additionalProperties: false
                        properties:
                          path:
                            type: string
                            description: 'Secret mount path (default: /secret)'
                          keysForEnv:
                            type: string
                            description: Secret keys to expose as env vars
              security:
                type: object
                additionalProperties: false
                properties:
                  seccompProfile:
                    type: string
                    description: 'Seccomp profile (default: DISABLED)'
                  automountServiceAccountToken:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Automount service account token (default: false)'
                  imagePullSecrets:
                    type: string
                    description: 'Image pull secrets (default: ENABLED)'
              terminationGracePeriodSeconds:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Pod termination grace period (default: 10)'
              prestopCommand:
                type: string
                description: PreStop lifecycle hook command
              scheduling:
                type: object
                additionalProperties: false
                properties:
                  affinityStrategy:
                    type: string
                    description: 'Pod affinity strategy (default: spread-nodes-and-zones-ha)'
                  tolerations:
                    type: string
                    pattern: "^\\[.*\\]$"
                    description: 'Pod tolerations as a JSON array, e.g. [{"operator":"Exists"}]'
                  nodeSelector:
                    type: string
                    pattern: "^[^=,]+=[^,]*(,[^=,]+=[^,]*)*$"
                    description: 'Node selector as comma-separated key=value pairs, e.g. disktype=ssd,zone=us-east-1a'
                  dnsPolicy:
                    type: string
                    description: Pod DNS policy
                  priorityClassName:
                    type: string
                    description: Pod priority class name
              probes:
                type: object
                additionalProperties: false
                properties:
                  liveness:
                    $ref: "#/$defs/probeConfig"
                  readiness:
                    $ref: "#/$defs/probeConfig"
                  startup:
                    $ref: "#/$defs/probeConfig"

          deployment:
            type: object
            additionalProperties: false
            description: Deployment-specific settings (workload.type=deployment)
            properties:
              envSubPath:
                type: string
                description: 'Deployment environment files sub-path (default: src/deployment-env)'
              additionalLabels:
                type: string
                description: Additional labels for deployment manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for deployment manifests
              rollingUpdate:
                type: object
                additionalProperties: false
                properties:
                  maxSurge:
                    type: string
                    description: 'Max pods over desired during rolling update (default: 1)'
                  maxUnavailable:
                    type: string
                    description: 'Max unavailable pods during rolling update (default: 0)'

          statefulset:
            type: object
            additionalProperties: false
            description: StatefulSet-specific settings (workload.type=statefulset)
            properties:
              envSubPath:
                type: string
                description: 'StatefulSet environment files sub-path (default: src/statefulset-env)'
              additionalLabels:
                type: string
                description: Additional labels for statefulset manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for statefulset manifests
              serviceName:
                type: string
                description: Governing headless service name
              podManagementPolicy:
                type: string
                enum: [OrderedReady, Parallel]
                description: 'Pod management policy (default: OrderedReady)'
              allowUnreliablePodManagementPolicy:
                type: string
                enum: ["I_LIKE_DOWNTIME"]
                description: Allow unreliable pod management policy override
              updateStrategy:
                type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum: [RollingUpdate, OnDelete]
                    description: 'Update strategy type (default: RollingUpdate)'
                  partition:
                    oneOf:
                      - type: integer
                        minimum: 0
                      - type: string
                        pattern: "^[0-9]+$"
                    description: Partition ordinal for canary updates
              pvc:
                type: object
                additionalProperties: false
                description: PersistentVolumeClaim configuration
                properties:
                  enabled:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Enable PVC generation (default: true)'
                  storageClassName:
                    type: string
                    description: Storage class name
                  storageSize:
                    type: string
                    description: 'PVC storage size (default: 1Gi)'
                  accessModes:
                    type: string
                    enum: [ReadWriteOnce, ReadOnlyMany, ReadWriteMany]
                    description: 'PVC access mode (default: ReadWriteOnce)'
                  volumeName:
                    type: string
                    description: 'Volume name (default: data)'
                  mountPath:
                    type: string
                    description: 'Mount path in container (default: /data)'

          daemonset:
            type: object
            additionalProperties: false
            description: DaemonSet-specific settings (workload.type=daemonset)
            properties:
              envSubPath:
                type: string
                description: 'DaemonSet environment files sub-path (default: src/daemonset-env)'
              additionalLabels:
                type: string
                description: Additional labels for daemonset manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for daemonset manifests
              updateStrategy:
                type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum: [RollingUpdate, OnDelete]
                    description: 'Update strategy type (default: RollingUpdate)'
                  maxUnavailable:
                    type: string
                    description: 'Max unavailable pods during rolling update (default: 1)'
              hostNetwork:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Use host network (default: false)'
              hostPid:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Use host PID namespace (default: false)'
              hostIpc:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Use host IPC namespace (default: false)'
              runAsNonRoot:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Run as non-root user (default: true)'
              privileged:
                type: string
                description: 'Run in privileged mode (default: false)'
              dnsPolicy:
                type: string
                description: Pod DNS policy
              tolerations:
                type: string
                pattern: "^\\[.*\\]$"
                description: 'Pod tolerations as a JSON array, e.g. [{"operator":"Exists"}]'
              nodeSelector:
                type: string
                pattern: "^[^=,]+=[^,]*(,[^=,]+=[^,]*)*$"
                description: 'Node selector as comma-separated key=value pairs, e.g. disktype=ssd,zone=us-east-1a'

          cronjob:
            type: object
            additionalProperties: false
            description: CronJob-specific settings (workload.type=cronjob)
            properties:
              nameSuffix:
                type: string
                description: Suffix appended to generated CronJob name
              combinedSubPath:
                type: string
                description: Combined sub-path for CronJob manifests
              concurrencyPolicy:
                type: string
                enum: [Allow, Forbid, Replace]
                description: 'How concurrent executions are handled (default: Forbid)'
              startingDeadlineSeconds:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: Deadline in seconds for starting the job
              successfulJobsHistoryLimit:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Successful jobs to retain (default: 1)'
              failedJobsHistoryLimit:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Failed jobs to retain (default: 5)'
              backoffLimit:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Retries before marking job failed (default: 0)'
              completions:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Desired completions (default: 1)'
              parallelism:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Max parallel pods (default: 1)'
              activeDeadlineSeconds:
                oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: "^[1-9][0-9]*$"
                description: Active deadline in seconds
              ttlSecondsAfterFinished:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: TTL seconds after job finished
              restartPolicy:
                type: string
                enum: [Never, OnFailure]
                description: 'Pod restart policy (default: Never)'
              envSubPath:
                type: string
                description: CronJob environment files sub-path
              additionalLabels:
                type: string
                description: Additional labels for CronJob manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for CronJob manifests
              portsEnabled:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Enable port definitions (default: false)'
              probes:
                type: object
                additionalProperties: false
                properties:
                  livenessEnabled:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Enable liveness probe (default: false)'
                  readinessEnabled:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Enable readiness probe (default: false)'
                  startupEnabled:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Enable startup probe (default: false)'

          job:
            type: object
            additionalProperties: false
            description: Job-specific settings (workload.type=job)
            properties:
              nameSuffix:
                type: string
                description: Suffix appended to generated Job name
              combinedSubPath:
                type: string
                description: Combined sub-path for Job manifests
              backoffLimit:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Retries before marking job failed (default: 0)'
              completions:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Desired completions (default: 1)'
              parallelism:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'Max parallel pods (default: 1)'
              activeDeadlineSeconds:
                oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: "^[1-9][0-9]*$"
                description: Active deadline in seconds
              ttlSecondsAfterFinished:
                oneOf:
                  - type: integer
                    minimum: 0
                  - type: string
                    pattern: "^[0-9]+$"
                description: 'TTL seconds after job finished (default: 86400)'
              restartPolicy:
                type: string
                enum: [Never, OnFailure]
                description: 'Pod restart policy (default: Never)'
              envSubPath:
                type: string
                description: Job environment files sub-path
              additionalLabels:
                type: string
                description: Additional labels for Job manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for Job manifests
              portsEnabled:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Enable port definitions (default: false)'
              probes:
                type: object
                additionalProperties: false
                properties:
                  livenessEnabled:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Enable liveness probe (default: false)'
                  readinessEnabled:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Enable readiness probe (default: false)'
                  startupEnabled:
                    oneOf:
                      - type: boolean
                      - type: string
                        pattern: "^(true|false)$"
                    description: 'Enable startup probe (default: false)'

          service:
            type: object
            additionalProperties: false
            description: Service manifest generator configuration
            properties:
              enabled:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Enable service generation
              type:
                type: string
                enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
                description: 'Service type (default: ClusterIP)'
              port:
                oneOf:
                  - type: integer
                    minimum: 1
                    maximum: 65535
                  - type: string
                    pattern: "^([1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
                description: 'Service port (default: 80)'
              targetPort:
                type: string
                description: Target port (defaults to container port)
              protocol:
                type: string
                enum: [TCP, UDP, SCTP]
                description: 'Service protocol (default: TCP)'
              portName:
                type: string
                description: Named port
              nodePort:
                oneOf:
                  - type: integer
                    minimum: 30000
                    maximum: 32767
                  - type: string
                    pattern: "^(30[0-9]{3}|31[0-9]{3}|32[0-6][0-9]{2}|327[0-5][0-9]|3276[0-7])$"
                description: Node port (NodePort type only)
              externalName:
                type: string
                description: External name (ExternalName type only)
              externalTrafficPolicy:
                type: string
                enum: [Cluster, Local]
                description: External traffic policy
              nameSuffix:
                type: string
                description: Suffix appended to generated service name
              combinedSubPath:
                type: string
                description: Combined sub-path for service manifests
              additionalLabels:
                type: string
                description: Additional labels for service manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for service manifests

          configmap:
            type: object
            additionalProperties: false
            description: ConfigMap manifest generator configuration
            properties:
              subPath:
                type: string
                description: 'Source directory (default: src/configmap)'
              nameSuffix:
                type: string
                description: Suffix appended to generated ConfigMap name
              combinedSubPath:
                type: string
                description: Combined sub-path for ConfigMap manifests
              nameChecksumInjection:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Inject ConfigMap checksum into workload annotations (default: true)'
              additionalLabels:
                type: string
                description: Additional labels for ConfigMap manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for ConfigMap manifests

          secretTemplate:
            type: object
            additionalProperties: false
            description: Secret template manifest generator configuration
            properties:
              subPath:
                type: string
                description: 'Source directory (default: src/secret.template)'
              nameSuffix:
                type: string
                description: Suffix appended to generated Secret template name
              combinedSubPath:
                type: string
                description: Combined sub-path for Secret template manifests
              nameChecksumInjection:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Inject Secret checksum into workload annotations (default: true)'
              additionalLabels:
                type: string
                description: Additional labels for Secret template manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for Secret template manifests

          serviceAccount:
            type: object
            additionalProperties: false
            description: ServiceAccount manifest generator configuration
            properties:
              enabled:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: 'Whether to generate a ServiceAccount manifest (default: false)'
              nameSuffix:
                type: string
                description: Suffix appended to generated ServiceAccount name
              combinedSubPath:
                type: string
                description: Combined sub-path for ServiceAccount manifests
              additionalLabels:
                type: string
                description: Additional labels for ServiceAccount manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for ServiceAccount manifests

          podDisruptionBudget:
            type: object
            additionalProperties: false
            description: PodDisruptionBudget manifest generator configuration
            properties:
              enabled:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: Enable PDB generation
              nameSuffix:
                type: string
                description: Suffix appended to generated PDB name
              combinedSubPath:
                type: string
                description: Combined sub-path for PDB manifests
              strategy:
                type: string
                enum: [max-unavailable, min-available]
                description: 'PDB strategy (default: max-unavailable)'
              value:
                type: string
                description: 'PDB value (default: 1)'
              additionalLabels:
                type: string
                description: Additional labels for PDB manifests
              additionalAnnotations:
                type: string
                description: Additional annotations for PDB manifests

      manifests:
        type: object
        additionalProperties: false
        description: >
          Manifest packaging and publishing. Applies to all manifests regardless
          of source (generated, hand-written, or hook-produced).
        properties:
          subPath:
            type: string
            description: 'Directory containing manifests (default: src/kubernetes)'
          allowLocalOverride:
            oneOf:
              - type: boolean
              - type: string
                pattern: "^(true|false)$"
            description: >
              When true, manifests from the local src/kubernetes directory may
              override manifests contributed by foreign sources (referenced
              bundles in a product build, vendor renderers, pre-package-prepare
              hooks) staged under
              <OUTPUT_SUB_PATH>/manifests/additional-manifests/, with a WARN
              log per override. When false (default), any path collision
              between local and foreign manifests fails the build. The reserved
              kaptain-{product,app,bundle,environment}-lineage-data.yaml
              filenames are checked separately and always fail on collision
              regardless of this flag.
          defaults:
            type: object
            additionalProperties: false
            properties:
              subPath:
                type: string
                description: 'Directory containing default token values (default: src/defaults)'
              allowLocalOverride:
                oneOf:
                  - type: boolean
                  - type: string
                    pattern: "^(true|false)$"
                description: >
                  When true, defaults from the local src/defaults directory may
                  override defaults contributed by foreign sources staged under
                  <OUTPUT_SUB_PATH>/manifests/additional-defaults/, with a
                  WARN log per override. When false (default), local defaults
                  must be byte-identical to any foreign default of the same
                  name or the build fails.
          repoProvider:
            type: object
            additionalProperties: false
            properties:
              type:
                type: string
                enum: [docker]
                description: 'Manifest storage provider type (default: docker)'
              packagingBaseImage:
                type: string
                description: 'Base image for manifest packaging (default: scratch)'
          templatesLayout:
            type: string
            enum: [flat, hierarchy]
            description: >
              How spec.templates entries land in the manifest tree of an
              app or bundle build. flat (default) merges every template's
              manifests into the shared foreign-contributor drop dirs with
              file-level collision detection, and each template's lineage
              CM is folded into this project's lineage CM as a data key.
              hierarchy keeps each template in its own per-bundle subdir,
              like spec.contents in a product or environment build. Has
              no effect on product or environment builds, where contents
              always land per-bundle and templates do not apply.

      environment:
        type: object
        additionalProperties: false
        description: >
          Environment build configuration. Applies only to
          kubernetes-run-environment builds which aggregate apps, bundles,
          and products listed in spec.contents.
        properties:
          clusterScopedDelegation:
            $ref: "#/$defs/runEnvClusterScopedDelegation"
          clusterScopedKindsFile:
            $ref: "#/$defs/runEnvClusterScopedKindsFile"
          allowLocalManifestsOverride:
            $ref: "#/$defs/runEnvAllowLocalManifestsOverride"
          failOnUnreferencedConfigOrSecrets:
            $ref: "#/$defs/runEnvFailOnUnreferencedConfigOrSecrets"
          trustedContributorsOnly:
            $ref: "#/$defs/runEnvTrustedContributorsOnly"
          imageAutoUpdateProvider:
            $ref: "#/$defs/runEnvImageAutoUpdateProvider"
          imageAutoUpdatePolicy:
            $ref: "#/$defs/runEnvImageAutoUpdatePolicy"
          imageAutoUpdateTrigger:
            $ref: "#/$defs/runEnvImageAutoUpdateTrigger"
          imageAutoUpdatePollSchedule:
            $ref: "#/$defs/runEnvImageAutoUpdatePollSchedule"
          imageAutoUpdateFieldManagerStrategy:
            $ref: "#/$defs/runEnvImageAutoUpdateFieldManagerStrategy"
          deployMode:
            $ref: "#/$defs/runEnvDeployMode"
          checksumSecretsTiming:
            $ref: "#/$defs/runEnvChecksumSecretsTiming"
          checksumLength:
            $ref: "#/$defs/runEnvChecksumLength"
          checksumOrderFile:
            $ref: "#/$defs/runEnvChecksumOrderFile"
          signoffsSubPath:
            $ref: "#/$defs/runEnvSignoffsSubPath"
          signoffsKindsFile:
            $ref: "#/$defs/runEnvSignoffsKindsFile"
          environmentDeploySourceBasePath:
            $ref: "#/$defs/runEnvEnvironmentDeploySourceBasePath"
          generateIdealEnvironmentDeployManifests:
            $ref: "#/$defs/runEnvGenerateIdealEnvironmentDeployManifests"
          # How a run-platform applies this environment's deploy-manifests
          # set. Environment-only since run-platforms deploy themselves.
          imageDeployManifestsApplyMode:
            $ref: "#/$defs/runEnvImageDeployManifestsApplyMode"
          environmentDeployBaseImage:
            $ref: "#/$defs/runEnvEnvironmentDeployBaseImage"
          # Every cleanup setting lives in one block, so each name inside it
          # sheds the cleanUp prefix the block already supplies. Envs get the
          # master policy, the exemption list and the accumulating classes;
          # namespace oversight is run-platform only, since only the RP
          # creates and cleans namespaces, and appears in that block instead.
          cleanUp:
            $ref: "#/$defs/runEnvCleanUp"
        allOf:
          # deployMode 'job' rejects an explicit provider of 'keel'
          # (Keel does not support job-mode). 'keelson' and 'none'
          # (manually triggered special cronjob) are both valid.
          # Absent provider is allowed - the build's default-fill stage
          # supplies 'keelson'.
          - if:
              required: [deployMode]
              properties: { deployMode: { const: job } }
            then:
              properties:
                imageAutoUpdateProvider: { enum: [keelson, none] }
          # Policy 'force' is Keel-only (Keelson rejects it), so it
          # requires an explicitly selected provider of 'keel'. The
          # build re-checks this at generation time, belt and braces.
          - if:
              required: [imageAutoUpdatePolicy]
              properties: { imageAutoUpdatePolicy: { const: force } }
            then:
              required: [imageAutoUpdateProvider]
              properties:
                imageAutoUpdateProvider: { const: keel }
          # When generateIdealEnvironmentDeployManifests is false the user
          # supplies their own env deploy manifest set, so the fields that
          # only drive generation (deployMode and the imageAutoUpdate*
          # family) must not be set. environmentDeployBaseImage is
          # unaffected and may still be configured - it drives the
          # Dockerfile FROM, not the manifests.
          - if:
              required: [generateIdealEnvironmentDeployManifests]
              properties:
                generateIdealEnvironmentDeployManifests:
                  enum: [false, "false"]
            then:
              not:
                anyOf:
                  - required: [deployMode]
                  - required: [imageAutoUpdateProvider]
                  - required: [imageAutoUpdatePolicy]
                  - required: [imageAutoUpdateTrigger]
                  - required: [imageAutoUpdatePollSchedule]
                  - required: [imageAutoUpdateFieldManagerStrategy]

      runPlatform:
        type: object
        additionalProperties: false
        description: >
          Run-platform build configuration. Applies only to
          kubernetes-run-platform-meta-environment builds which aggregate
          apps, bundles, and products listed in spec.contents and seed
          managed run-* child projects.
        properties:
          allowLocalManifestsOverride:
            $ref: "#/$defs/runEnvAllowLocalManifestsOverride"
          failOnUnreferencedConfigOrSecrets:
            $ref: "#/$defs/runEnvFailOnUnreferencedConfigOrSecrets"
          trustedContributorsOnly:
            $ref: "#/$defs/runEnvTrustedContributorsOnly"
          imageAutoUpdateProvider:
            $ref: "#/$defs/runEnvImageAutoUpdateProvider"
          imageAutoUpdatePolicy:
            $ref: "#/$defs/runEnvImageAutoUpdatePolicy"
          imageAutoUpdateTrigger:
            $ref: "#/$defs/runEnvImageAutoUpdateTrigger"
          imageAutoUpdatePollSchedule:
            $ref: "#/$defs/runEnvImageAutoUpdatePollSchedule"
          imageAutoUpdateFieldManagerStrategy:
            $ref: "#/$defs/runEnvImageAutoUpdateFieldManagerStrategy"
          deployMode:
            $ref: "#/$defs/runEnvDeployMode"
          checksumSecretsTiming:
            $ref: "#/$defs/runEnvChecksumSecretsTiming"
          checksumLength:
            $ref: "#/$defs/runEnvChecksumLength"
          checksumOrderFile:
            $ref: "#/$defs/runEnvChecksumOrderFile"
          signoffsSubPath:
            $ref: "#/$defs/runEnvSignoffsSubPath"
          signoffsKindsFile:
            $ref: "#/$defs/runEnvSignoffsKindsFile"
          environmentDeploySourceBasePath:
            $ref: "#/$defs/runEnvEnvironmentDeploySourceBasePath"
          generateIdealEnvironmentDeployManifests:
            $ref: "#/$defs/runEnvGenerateIdealEnvironmentDeployManifests"
          environmentDeployBaseImage:
            $ref: "#/$defs/runEnvEnvironmentDeployBaseImage"
          # Same block as under environment, plus the namespace oversight
          # keys: only the RP creates and cleans namespaces, so only the RP
          # can say what happens to namespaces it did not declare.
          cleanUp:
            $ref: "#/$defs/runPlatformCleanUp"
        allOf:
          # deployMode 'job' rejects an explicit provider of 'keel'
          # (Keel does not support job-mode). 'keelson' and 'none'
          # (manually triggered special cronjob) are both valid.
          # Absent provider is allowed - the build's default-fill stage
          # supplies 'keelson'.
          - if:
              required: [deployMode]
              properties: { deployMode: { const: job } }
            then:
              properties:
                imageAutoUpdateProvider: { enum: [keelson, none] }
          # Policy 'force' is Keel-only (Keelson rejects it), so it
          # requires an explicitly selected provider of 'keel'. The
          # build re-checks this at generation time, belt and braces.
          - if:
              required: [imageAutoUpdatePolicy]
              properties: { imageAutoUpdatePolicy: { const: force } }
            then:
              required: [imageAutoUpdateProvider]
              properties:
                imageAutoUpdateProvider: { const: keel }
          # When generateIdealEnvironmentDeployManifests is false the user
          # supplies their own env deploy manifest set, so the fields that
          # only drive generation (deployMode and the imageAutoUpdate*
          # family) must not be set. environmentDeployBaseImage is
          # unaffected and may still be configured - it drives the
          # Dockerfile FROM, not the manifests.
          - if:
              required: [generateIdealEnvironmentDeployManifests]
              properties:
                generateIdealEnvironmentDeployManifests:
                  enum: [false, "false"]
            then:
              not:
                anyOf:
                  - required: [deployMode]
                  - required: [imageAutoUpdateProvider]
                  - required: [imageAutoUpdatePolicy]
                  - required: [imageAutoUpdateTrigger]
                  - required: [imageAutoUpdatePollSchedule]
                  - required: [imageAutoUpdateFieldManagerStrategy]

      changeSource:
        type: object
        additionalProperties: false
        description: Change source tracking configuration
        properties:
          noteEnabled:
            oneOf:
              - type: boolean
              - type: string
                pattern: "^(true|false)$"
            description: >
              Write git notes recording the source branch and PR author during
              PR builds, read back during release builds (default: true)

      hooks:
        type: object
        additionalProperties: false
        description: >
          Lifecycle hook script paths, relative to the repository root.
          Hooks are injectable scripts that run at specific pipeline points.
        properties:
          preBuild:
            $ref: "#/$defs/hookScriptPath"
            description: Runs at the start of the build, before quality checks
          preTaggingTests:
            $ref: "#/$defs/hookScriptPath"
            description: Runs before version tagging
          postVersionsAndNaming:
            $ref: "#/$defs/hookScriptPath"
            description: Runs after version calculation completes
          preDockerPrepare:
            $ref: "#/$defs/hookScriptPath"
            description: Runs before Docker build preparation
          postDockerTests:
            $ref: "#/$defs/hookScriptPath"
            description: Runs after Docker build and validation
          prePackagePrepare:
            $ref: "#/$defs/hookScriptPath"
            description: Runs before manifest packaging
          postPackageTests:
            $ref: "#/$defs/hookScriptPath"
            description: Runs after manifest packaging
          postBuild:
            $ref: "#/$defs/hookScriptPath"
            description: Runs at the end of the build

      specBuild:
        type: object
        additionalProperties: false
        description: Spec build and validation configuration
        properties:
          type:
            type: string
            enum: [schema, api]
            description: 'Type of spec being built (schema or api)'
          jsonSchemaUrl:
            type: string
            description: 'JSON Schema meta-schema file path or URL (default: src/schemas/json-schema-draft-2020-12.json)'
          packagingBaseImage:
            type: string
            description: 'Base image for spec packaging (default: scratch)'

      layer:
        type: object
        additionalProperties: false
        description: Layer and layerset build configuration
        properties:
          packagingBaseImage:
            type: string
            description: 'Base image for layer packaging (default: scratch)'
          tokenSubstitution:
            oneOf:
              - type: boolean
              - type: string
                pattern: "^(true|false)$"
            description: 'Apply token substitution to KaptainPM files in docker build and GitHub release (default: true)'

      vendorHelmRendered:
        type: object
        additionalProperties: false
        description: Vendor helm chart rendered to plain kubernetes manifests at build time
        properties:
          repoUrl:
            type: string
            description: Traditional helm repo URL (mutually exclusive with ociChart)
          chartName:
            type: string
            description: Chart name within the repo (required with repoUrl)
          ociChart:
            type: string
            description: OCI chart reference (mutually exclusive with repoUrl+chartName)
          moveFiles:
            type: array
            description: >
              Explicit list of files to keep from rendered output and where to
              place them. Files not listed are discarded.
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - source
                - destination
              properties:
                source:
                  type: string
                  description: Filename in C-split/ to copy
                destination:
                  type: string
                  description: Target filename in D-moved-files/
          sedReplace:
            type: object
            additionalProperties: false
            description: Sed in-place replacements applied after file mapping
            properties:
              global:
                type: array
                description: Sed patterns applied to all mapped files
                items:
                  type: string
              perFile:
                type: array
                description: Sed patterns applied to specific files
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - file
                    - patterns
                  properties:
                    file:
                      type: string
                      description: Target filename in E-sed-replaced/
                    patterns:
                      type: array
                      description: Sed patterns to apply to this file
                      items:
                        type: string
          yqTransform:
            type: object
            additionalProperties: false
            description: Inline yq expressions applied after sed replacements
            properties:
              global:
                type: array
                description: yq expressions applied to all mapped files
                items:
                  type: string
              perFile:
                type: array
                description: yq expressions applied to specific files
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - file
                    - expressions
                  properties:
                    file:
                      type: string
                      description: Target filename in F-yq-transformed/
                    expressions:
                      type: array
                      description: yq expressions to apply to this file
                      items:
                        type: string
          imageRetags:
            type: array
            description: Docker images to pull and retag as part of this build
            items:
              type: object
              additionalProperties: false
              required:
                - sourceImageUri
                - tagSuffix
              properties:
                sourceImageUri:
                  type: string
                  description: >
                    Full source image URI including tag
                    (e.g., docker.io/envoyproxy/gateway:v1.3.0)
                tagSuffix:
                  type: string
                  description: >
                    Suffix appended to the build version for the target tag
                    (e.g., gateway -> 1.2.3-gateway)
          useProjectNameAsFullnameOverride:
            oneOf:
              - type: boolean
              - type: string
                pattern: "^(true|false)$"
            default: true
            description: >
              Pass --set fullnameOverride=<project-name> to helm template so
              rendered resource names use the project name directly instead of
              the chart's release-name + chart-name concatenation. Set to false
              to use the chart's default naming or to control fullnameOverride
              via the values file instead.

  # ---------------------------------------------------------------------------
  # Run-environment family shared settings (used by spec.main.environment and
  # spec.main.runPlatform; defined once and referenced from both)
  # ---------------------------------------------------------------------------

  runEnvAllowLocalManifestsOverride:
    oneOf:
      - type: boolean
      - type: string
        pattern: "^(true|false)$"
    description: >
      When true, manifests from the local src/kubernetes directory may
      override manifests contributed by referenced children (matched by
      file path), with a WARN log per override. When false (default), a
      local manifest at the same file path as any child-contributed
      manifest fails the build. The reserved lineage filename
      kaptain-environment-lineage-data.yaml (used by both env and
      run-platform builds) is checked separately and always fails on
      collision regardless of this flag.

  runEnvFailOnUnreferencedConfigOrSecrets:
    oneOf:
      - type: boolean
      - type: string
        pattern: "^(true|false)$"
    description: >
      When true (default), a value file under src/config or src/secrets
      that is not referenced by any token in the assembled manifest tree
      fails the build. When false, unreferenced values are tolerated and
      logged at WARN. Defaults are exempt - an unused default is a
      permitted fallback.

  runEnvTrustedContributorsOnly:
    oneOf:
      - type: boolean
      - type: string
        pattern: "^(true|false)$"
    description: >
      Master disable for the sensitive-resource sign-off check. When false
      (default) every sensitive resource (Ingress, RBAC, webhooks, routes,
      NetworkPolicy, ...) in the assembled tree must carry a checked-in
      sign-off or the build fails. When true the whole check is skipped -
      only appropriate when every contributor to every aggregated bundle
      is trusted. The skip is logged loudly as a master disable.

  runEnvImageAutoUpdateProvider:
    type: string
    enum: [keel, keelson, none]
    description: >
      In-cluster controller that watches workload container images for
      new versions and applies updates. The selected provider's
      annotation scheme is injected onto the environment's own workload
      manifest. 'keelson' (default) uses Keelson. 'keel' uses Keel
      (deployment-mode only). 'none' opts out: no annotations are
      injected (with deployMode 'job' this is the manually triggered
      special cronjob).

      Constraint: when deployMode is 'job', this field, if set, must be
      'keelson' or 'none' (Keel does not support job-mode deploys).
      When this field is absent, the build's default-fill stage supplies
      'keelson' regardless of deployMode, so a project that wants
      job-mode can simply omit the provider.

  runEnvImageAutoUpdatePolicy:
    type: string
    enum: [patch, minor, major, all, force]
    description: >
      Version-bump policy for the auto-update annotations injected onto
      the environment's own workload manifest. 'patch' (default) only
      auto-applies patch-level bumps. 'force' redeploys on every poll
      regardless of tag and is Keel-only (Keelson rejects it): the
      schema requires an explicitly selected imageAutoUpdateProvider of
      'keel' to use it, and the build re-checks at generation time,
      belt and braces. Ignored when the provider is 'none'.

  runEnvImageAutoUpdateTrigger:
    type: string
    enum: [poll, default]
    description: >
      How the auto-update provider notices new tags. 'poll' (default)
      polls the registry on the poll schedule. 'default' is the
      provider's event-driven mode (registry webhooks); Keelson
      currently treats it as poll. Ignored when the provider is 'none'.

  runEnvImageAutoUpdatePollSchedule:
    type: string
    pattern: '^[0-9]+[smh]$'
    description: >
      Poll cadence for the auto-update annotations as a plain duration
      (e.g. '1m', '300s', '1h'). Default '1m'. Stored normalized and
      rendered per provider at generation time: Keel takes
      '@every <duration>', Keelson takes a cron expression. Ignored
      when the provider is 'none'.

  runEnvImageAutoUpdateFieldManagerStrategy:
    type: string
    enum: [mimic, patch, claim]
    description: >
      Keelson field-manager strategy annotation
      (keelson.pro/field-manager-strategy) stamped on the environment's
      workload manifest when the provider is 'keelson'. Default 'mimic'
      (SSA attributed to the detected Apply-op owner: no ownership
      churn). 'patch' and 'claim' attribute the write to keelson
      itself. Applies only to keelson; ignored for keel (no keel.sh
      equivalent exists) and for 'none'.

  runEnvClusterScopedKindsFile:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    default: default-1.1.txt
    description: >
      File NAME (with version) of the cluster-scoped Kind list driving
      the clusterScopedDelegation=parent carve-out. Documents of these
      Kinds are moved out of the env deploy image's applyable manifests
      into the separate on-behalf dir for the run-platform parent. The
      name is resolved in the toolkit's fixed data directory
      src/data/cluster-scoped-kinds/ - the path is not configurable, so
      extensions of the toolkit can ship additional versioned lists
      there and projects select one by name. Data files are immutable
      once published: changes land as a new version, bad versions are
      removed, never edited. The selected file replaces the default list
      entirely (no merge). Ignored when clusterScopedDelegation=self.

  runEnvClusterScopedDelegation:
    type: string
    enum: [self, parent]
    description: >
      Who applies the environment's cluster-scoped resources. This is
      also the deploy permission model - the two are one choice.
      'self' (default): the env deploy holds cluster-admin (generated
      RBAC is a ClusterRoleBinding to cluster-admin) and applies
      everything itself, including cluster-scoped resources. 'parent':
      the env deploy holds namespace-admin only (generated RBAC is a
      RoleBinding to the built-in 'admin' ClusterRole in the env
      namespace) and its cluster-scoped resources are packaged into
      the separate on-behalf dir in the env image for the run-platform
      parent to apply, with field ownership as if the env applied them
      itself. When RBAC manifests are supplied rather than generated,
      the build validates the supplied role scope matches this setting
      (cluster-admin present means 'parent' is pointless and rejected;
      namespace-only roles mean cluster-scoped content requires
      'parent').

  runEnvDeployMode:
    type: string
    enum: [deployment, job]
    description: >
      Workload kind for the env's deploy image: 'deployment' (default,
      always-running reconciler) or 'job' (one-shot apply on schedule).
      Maps to the DEPLOY_MODE env var consumed by the deploy image at
      runtime.

      Constraint: 'job' requires imageAutoUpdateProvider 'keelson' or
      'none' (manually triggered special cronjob). Keel does not
      support job-mode deploys. The schema rejects deployMode=job
      paired with an explicit provider of 'keel'; an absent provider
      is allowed and the build's default-fill stage supplies 'keelson'.

      'job' mode also generates a zero-scale Deployment of the same
      image alongside the suspended CronJob, so an operator can scale
      it to 1 to debug/explore/fix on the rare occasions that's needed.

  runEnvChecksumSecretsTiming:
    type: string
    enum: [build, deploy]
    default: build
    description: >
      When the checksum suffix on Secret resource names is resolved.
      Both timings use the same leaf-to-workload-and-above ordering
      machinery and yield the same correctness; they trade off what
      triggers a rolling restart and when the manifest set's
      secret resource names are final.

      'build' (default) - the build hashes the combination of the
      encrypted-on-disk secret blobs and template content and
      substitutes the final name into the manifest set at build time.
      All resource names are final in the published environment definition
      image and environment manifest zip. Rotating the encryption key
      (re-encrypting the same plaintext with a new key) changes the
      encrypted bytes, so the secret name changes, so workloads referencing
      it get new names too and do rolling restarts. This is the safer
      default - the published manifest set is fully self-describing - at
      the cost of a rolling restart on key rotation even when the
      plaintext secret values are unchanged.

      'deploy' - the build leaves the checksum-suffix placeholder in
      the secret templates within the manifest set and the deploy image
      runs the same hashing and name-replacement pass at apply time,
      hashing the whole final secret manifest after all secret tokens
      have been replaced by their associated decrypted plaintext values.
      Key rotation no longer triggers a rolling restart (same plaintext =
      same hash). The cost is that the published manifest set has secrets
      with unresolved placeholder names - meaning the only place to know
      the final name of a given secret is to look in the cluster itself
      which contradicts the transparency ethos of the Kaptain project.

      Applies only to Secret resources. ConfigMaps, Jobs, RBAC
      resources, and any other checksum-suffixed types always hash at
      build time - Secrets are unique in having an encryption layer
      that the timing choice defers past.

  runEnvChecksumLength:
    type: integer
    minimum: 1
    maximum: 52
    default: 5
    description: >
      Length in Base32 characters of the checksum suffix that replaces
      the '-<kind>-checksum' marker on opted-in resource names. The
      suffix is a truncated Base32-encoded SHA-256 hash, so 52 is the
      hard upper bound (256 bits = 52 Base32 characters). The build
      warns below 4 (collision risk rises sharply) and above 12 (long
      suffixes hurt readability and push some names over the length
      limit). Applies to every checksummed kind, Secrets included.

      Changing this setting on a running full system changes every
      checksummed resource name, so the next deploy triggers a round
      of rolling updates across every workload that references a
      checksum-named resource.

  runEnvChecksumOrderFile:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    default: default-1.1.txt
    description: >
      File NAME (with version) of the ordered-kinds list driving the
      resource-checksum pass. The name is resolved in the toolkit's
      fixed data directory src/data/resource-order/ - the path is not
      configurable, so extensions of the toolkit can ship additional
      versioned lists there and projects select one by name. Data files
      are immutable once published: changes land as a new version, bad
      versions are removed, never edited. The selected file replaces the
      default list entirely (no merge).

  runEnvSignoffsSubPath:
    type: string
    pattern: "^[^/].*[^/]$|^[^/]$"
    default: src/signoffs
    description: >
      Base path under the repo root holding the sensitive-resource
      signoff files. Each signoff mirrors its manifest's path within the
      assembled tree. See the sensitive-resource signoff gate in the
      finalise step.

  runEnvSignoffsKindsFile:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    default: default-1.1.txt
    description: >
      File NAME (with version) of the sensitive-Kind list enforced by
      the signoff gate. The name is resolved in the toolkit's fixed data
      directory src/data/signoff-kinds/ - the path is not configurable,
      so extensions of the toolkit can ship additional versioned lists
      there and projects select one by name. Data files are immutable
      once published: changes land as a new version, bad versions are
      removed, never edited. The selected file replaces the default list
      entirely (no merge).

  runEnvEnvironmentDeploySourceBasePath:
    type: string
    pattern: "^[^/].*[^/]$|^[^/]$"
    default: src/environment
    description: >
      Base path under the repo root that holds the source tree for the
      env deploy image build - the manifests, config, defaults, configmap
      sources, and secret templates that produce the env's own deploy
      image (separate from the workload aggregate manifest set assembled
      from spec.contents).

      Default 'src/environment'. Children resolve relative to this
      base: '<base>/kubernetes', '<base>/config', '<base>/defaults',
      '<base>/configmap', '<base>/secret.template'. Overriding this
      setting shifts the entire subtree in one move - individual child
      paths are not separately configurable.

      No leading or trailing slash. Repo-root-relative only.

  runEnvGenerateIdealEnvironmentDeployManifests:
    oneOf:
      - type: boolean
      - type: string
        pattern: "^(true|false)$"
    default: true
    description: >
      When true (default), the build generates the env deploy manifest
      set from the configured deployMode and imageAutoUpdateProvider
      using standard internal templates. When false, the user supplies
      the manifest set under <environmentDeploySourceBasePath>/kubernetes
      (or, in future, via a template-set selection). In that mode
      deployMode and imageAutoUpdateProvider MUST NOT be set since they
      only drive generation; the schema enforces this.

      environmentDeployBaseImage is unaffected and may still be set
      independently - it drives the Dockerfile FROM line of the env
      deploy image build, not the manifests.

  runEnvImageDeployManifestsApplyMode:
    type: string
    enum: [seed-and-compare, enforce-state-normally]
    default: seed-and-compare
    description: >
      How a run-platform applies this environment's deploy-manifests set -
      the manifests that install and run this environment's deploy image.

      'seed-and-compare' (default) - the run-platform applies the set when
      it is absent. Thereafter it compares the manifests against what is in
      the cluster and changes things only when the config, secrets or other
      structural values differ; when it does, the image version tag used is
      the later of the manifests version and the in-cluster version, so an
      environment already upgraded past what was seeded is never rolled
      backwards. Suits an environment that will be upgraded directly after
      seeding, whether by its own image auto-update provider or by a
      deliberate out-of-band change.

      'enforce-state-normally' - the run-platform applies the set every run
      like any other resource, so the environment's deployer is
      continuously reconciled to what was shipped.

      Environment-only setting since run-platforms deploy themselves. When
      set to seed-and-compare the environment deploy manifest set is marked
      so the run-platform deployment can identify them for special
      treatment.

  runEnvEnvironmentDeployBaseImage:
    type: object
    additionalProperties: false
    description: >
      Components of the base OCI image used as FROM in the Dockerfile
      that builds the env deploy image. Composed at build time as
      '<registry>/[<namespace>/]image/image-environment-deploy-<family>:<version>'.
      The middle segment 'image/image-environment-deploy-' is fixed.
      Used only as the Dockerfile FROM line - never injected into any
      manifest, and unaffected by generateIdealEnvironmentDeployManifests.

      Namespace handling mirrors spec.main.docker's targetNamespace /
      targetIncludeNamespace pair: includeNamespace is the explicit
      registry-discriminator flag, defaulting true to match the
      namespace default having a value, and the two must always be
      resolvable together in one file.

      All sub-fields are optional; the build's default-fill stage
      supplies any not set here.
    # includeNamespace=false contradicts a non-empty namespace; rejected in
    # every variant, including the layer-merged final - a project consuming a
    # namespace-setting layer with the flag off must resolve the conflict
    # explicitly by setting namespace: "" in the project file (which overrides
    # the layer's value in the merge). Unlike docker's pair there is no
    # bootstrap circularity here - the base image is consumed as a Dockerfile
    # FROM long after layer resolution - so layers may contribute either field.
    allOf:
      - if:
          properties:
            includeNamespace:
              const: false
          required: [includeNamespace]
        then:
          properties:
            namespace:
              const: ""
    properties:
      registry:
        type: string
        description: >
          OCI registry host (and optional port). Default ships with
          the Kaptain release.
      includeNamespace:
        oneOf:
          - type: boolean
          - type: string
            pattern: "^(true|false)$"
        description: >
          Include the namespace segment in the composed base image
          reference. Default true. Set false for flat registry
          layouts: build-injected namespace defaults are disregarded,
          and a non-empty namespace alongside false is rejected by
          schema - in every variant, so a layer-contributed namespace
          must be overridden with an explicit namespace "" in the
          project file.
      namespace:
        anyOf:
          - $ref: "#/$defs/registryNamespace"
          - const: ""
        description: >
          Namespace path segment. Supports nested paths, but no
          leading/trailing slashes. Empty string is treated as not
          configured.
      family:
        type: string
        description: >
          The '<family>' suffix that follows the fixed
          'image-environment-deploy-' segment (for example 'trixie-slim').
          Default ships with the Kaptain release.
      version:
        type: string
        description: >
          Tag of the base image. Default ships with the Kaptain
          release and is pinned to a known-good combination with
          this Kaptain version.

  runEnvCleanUpPolicy:
    type: string
    enum: [dryrun, enabled]
    default: dryrun
    description: >
      Cleanup policy. Used as the master gate at cleanUp.policy, as the
      default for overseen namespaces at
      cleanUp.additionalNamespaces.defaultPolicy, as a per-namespace
      override, and for namespaces nobody declared at
      cleanUp.undeclaredNamespacePolicy.

      'dryrun' (default) - compute the candidate set, log every intended
      action with full detail (kind, name, why), exit 0, delete nothing.
      'enabled' - the logged deletes happen.

      The master gate is an absolute no-delete when dryrun: no setting
      beneath it can escalate past it, only match it or be more
      conservative.

      Candidate scope for the master gate:
      - Namespaced resources in the env's own ns (or the RP's managed
        nses) - the namespace is ours, so undeclared resources within
        are candidates.
      - Cluster-scoped resources (excluding Namespace itself) - require
        ownership proof identifying THIS env, since a single cluster
        can host multiple envs. Any one of: name prefix of environment
        name, name suffix of environment name, environment-identifying
        label (e.g. kaptain.org/environment carrying the env name),
        environment-identifying annotation (same), or a
        metadata.managedFields entry naming our field-manager. Any
        single match is sufficient.
      - Namespace resources: only the RP creates and cleans them; an env
        never touches them. Governed by undeclaredNamespacePolicy and
        the per-namespace policies rather than by this gate alone.

      Matches in cleanUp.additionalResources are excluded from
      candidates regardless of mode.

  runEnvResourceMatcher:
    type: object
    additionalProperties: false
    required: [kind]
    description: >
      Matches resources by kind plus either a name (exact or glob) or a
      label selector, exclusively one or the other.

      One definition, used in three places: cleanUp.additionalResources
      (tolerated in namespaces we own), and the allowedResources /
      deniedResources lists of an overseen namespace. The rule is the
      same everywhere - authorised equals declared plus allowed - and an
      overseen namespace simply has an empty declared half.

      Pick name for stable named infra (Services, ConfigMaps with known
      names). Pick labelSelector for controller-managed dynamics
      (kube-system Pods, operator-emitted resources, cert-manager and
      mesh-injected content) where names carry random suffixes but
      labels are stable.
    properties:
      kind:
        type: string
        not: { const: Namespace }
        description: >
          K8s resource Kind (PascalCase, e.g. Pod, Service, ConfigMap).

          Namespace is rejected wherever this matcher is used. In
          additionalResources it would exempt something that was never a
          candidate, and inside an overseen namespace the Namespace
          object itself is never a candidate either. Namespaces are
          governed by undeclaredNamespacePolicy and by appearing in
          additionalNamespaces - never by a resource matcher.
      name:
        type: string
        description: >
          K8s resource name (DNS-1123) or glob pattern with * and ?
          wildcards. Examples: 'envoy-gateway-cert' (exact),
          'cert-manager-*' (prefix), 'bootstrap-token-??????' (fixed
          width). Every resource of the kind is written as the match-all
          glob "*", which MUST be quoted - a bare * is a YAML alias
          indicator. There is no kind-only form: a matcher always states
          how it matches. Mutually exclusive with labelSelector.
      labelSelector:
        type: object
        additionalProperties: false
        required: [matchLabels]
        description: >
          K8s-style label match (matchLabels only - matchExpressions
          intentionally omitted). Mutually exclusive with name.
        properties:
          matchLabels:
            type: object
            additionalProperties:
              type: string
            description: >
              Map of label key to required value. A resource must carry
              every key with the matching value to qualify - the listed
              labels AND together. Example: {k8s-app: kube-dns}.
    oneOf:
      - required: [name]
        not: { required: [labelSelector] }
      - required: [labelSelector]
        not: { required: [name] }

  runEnvAccumulatingClass:
    type: object
    additionalProperties: false
    required: [type]
    description: >
      Retention rule for one accumulating resource class. The parameter
      field is required by exactly its own type and forbidden otherwise,
      so a stale threshold cannot be left behind after switching type.
    properties:
      type:
        type: string
        enum: [none, all, age, count]
        default: none
        description: >
          'none' (default) - no cleanup for this class; the build emits
            no cleanup intent.
          'all' - clean every matching resource regardless of age.
            Intended for dev clusters and CI fixture teardown; never
            appropriate for production.
          'age' - clean resources older than the 'age' threshold.
          'count' - keep only the N most recent (by creationTimestamp)
            per series, where a series is the resources sharing a
            kaptain.org/cleanup-series annotation value. Resources
            without the annotation are not candidates under this type.
      age:
        type: string
        pattern: "^[0-9]+[smhdw]$"
        description: >
          Age threshold, required when type is 'age'. K8s-style
          single-unit duration: an integer followed by s, m, h, d or w.
          Examples: '30d', '6h', '90s'. Compound durations like '1h30m'
          are not supported - pick the largest meaningful unit.
      count:
        type: integer
        minimum: 1
        description: >
          Per-series retention count, required when type is 'count'.
          Keep the N most recent by creationTimestamp within each
          series and delete the rest. Minimum 1 - to delete every
          resource in the series use type 'all'.
    allOf:
      - if:
          required: [type]
          properties: { type: { const: age } }
        then:
          required: [age]
        else:
          not: { required: [age] }
      - if:
          required: [type]
          properties: { type: { const: count } }
        then:
          required: [count]
        else:
          not: { required: [count] }

  runEnvAccumulatingResources:
    type: object
    additionalProperties: false
    description: >
      Retention rules for the resource classes that ACCUMULATE over
      time, which is why only these three are individually controlled:
      Jobs pile up per run, ConfigMaps and Secrets version up under
      checksum-suffixed names. Solid singular things - workloads,
      Services, namespaces - do not accumulate, so age and count are
      meaningless for them and they are governed by the master policy
      and the matcher lists instead.

      Every class defaults to 'none', so omitting the block entirely
      means no per-class retention cleanup.
    properties:
      jobs:
        $ref: "#/$defs/runEnvAccumulatingClass"
      configmaps:
        $ref: "#/$defs/runEnvAccumulatingClass"
      secrets:
        $ref: "#/$defs/runEnvAccumulatingClass"

  runEnvCleanUp:
    type: object
    additionalProperties: false
    description: >
      Cleanup configuration for an environment build. One block so every
      setting inside sheds the prefix the block supplies.
    properties:
      policy:
        $ref: "#/$defs/runEnvCleanUpPolicy"
      additionalResources:
        type: array
        description: >
          Resources in our managed namespace(s) that we did not declare
          but expect to exist; preserved from cleanup. Typical sources:
          operator-injected sidecars (Envoy gateway proxy),
          controller-managed CMs and Secrets (cert-manager),
          sidecar/mesh injectors.

          Layer-composable: a layer can contribute entries that
          deep-merge with the project's own list. One layer per upstream
          tool is a sensible organisation pattern (e.g.
          layer-envoy-cleanup-exempts).
        items:
          $ref: "#/$defs/runEnvResourceMatcher"
      accumulatingResources:
        $ref: "#/$defs/runEnvAccumulatingResources"

  runPlatformCleanUp:
    type: object
    additionalProperties: false
    description: >
      Cleanup configuration for a run-platform build: the environment
      block plus namespace oversight, which is RP-only because only the
      RP creates and cleans namespaces.
    properties:
      policy:
        $ref: "#/$defs/runEnvCleanUpPolicy"
      additionalResources:
        type: array
        description: >
          As per the environment block - resources in our managed
          namespace(s) we did not declare but expect to exist.
        items:
          $ref: "#/$defs/runEnvResourceMatcher"
      accumulatingResources:
        $ref: "#/$defs/runEnvAccumulatingResources"
      undeclaredNamespacePolicy:
        $ref: "#/$defs/runEnvCleanUpPolicy"
      additionalNamespaces:
        $ref: "#/$defs/runPlatformAdditionalNamespaces"

  runPlatformAdditionalNamespaces:
    type: object
    additionalProperties: false
    required: [namespaces]
    description: >
      Namespaces this RP does not own or manage but oversees. Typical
      use case: keeping kube-system and similar factory or cloud-vendor
      namespaces under control by declaring what may live in them.

      Deliberately distinct from undeclaredNamespacePolicy, which sits
      alongside this block rather than inside it: 'declared' means
      shipped as a manifest in the image, so everything here is
      undeclared too, and that setting's scope is wider than this list.

      The Namespace resource itself is never a candidate for any
      namespace named here - the RP oversees content, not existence.
      Listing a namespace with an empty deniedResources is therefore the
      way to protect a namespace while policing nothing inside it.
    properties:
      defaultPolicy:
        $ref: "#/$defs/runEnvCleanUpPolicy"
      namespaces:
        type: array
        items:
          $ref: "#/$defs/runPlatformAdditionalNamespace"

  runPlatformAdditionalNamespace:
    type: object
    additionalProperties: false
    required: [name]
    description: >
      One overseen namespace. Exactly one of allowedResources or
      deniedResources must be present - the entry states its posture, so
      a bare name (which would read as harmless registration while
      meaning 'delete everything in here') is not expressible.

      allowedResources is allow-list posture: only listed resources are
      authorised, anything else is a candidate. Suits a namespace whose
      inventory you intend to keep known.

      deniedResources is deny-list posture: only listed resources are
      candidates, anything else is left alone. Suits a namespace whose
      inventory is somebody else's business and where you care about
      specific things that should not be there. An empty list means
      watch this namespace and police nothing in it.
    properties:
      name:
        type: string
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        description: >
          Exact K8s namespace name (DNS-1123). No glob patterns -
          additional namespaces are known, named entities (kube-system,
          default, etc.); listing them by pattern would be brittle.
      policy:
        $ref: "#/$defs/runEnvCleanUpPolicy"
      allowedResources:
        type: array
        description: >
          Allow-list posture. Resources in this namespace not matched by
          any entry are unauthorised and become candidates under the
          effective policy. An empty list means the namespace must be
          strictly empty.
        items:
          $ref: "#/$defs/runEnvResourceMatcher"
      deniedResources:
        type: array
        description: >
          Deny-list posture. Only resources matched by an entry are
          candidates; everything else is tolerated. An empty list means
          nothing here is a candidate.
        items:
          $ref: "#/$defs/runEnvResourceMatcher"
    oneOf:
      - required: [allowedResources]
        not: { required: [deniedResources] }
      - required: [deniedResources]
        not: { required: [allowedResources] }


  # ---------------------------------------------------------------------------
  # Shared building blocks
  # ---------------------------------------------------------------------------

  registryDomain:
    type: string
    pattern: "^[^/]+$"
    description: >
      Container registry hostname[:port]. No slashes; paths belong in the
      namespace field. Used wherever docker login/push/pull targets a registry.

  registryNamespace:
    type: string
    pattern: "^[^/](.*[^/])?$"
    description: >
      Container registry namespace/organisation. Supports nested paths, but
      no leading/trailing slashes.

  hookScriptPath:
    type: string
    pattern: "^[^/]"
    description: >
      Lifecycle hook script path, relative to the repository root.
      Must not start with a slash.

  registryLogin:
    description: Registry authentication configuration. Type field selects the login method.
    type: object
    required: [type]
    oneOf:
      - description: Username and password
        additionalProperties: false
        properties:
          type:
            type: string
            const: username-password
          usernameSecret:
            type: string
            description: Credential name containing the registry username
          passwordSecret:
            type: string
            description: Credential name containing the registry password
        required: [type, usernameSecret, passwordSecret]

      - description: GitHub Actions implicit token (no secret needed)
        additionalProperties: false
        properties:
          type:
            type: string
            const: github-token
          token:
            type: string
            description: Token env var name (typically GITHUB_TOKEN)
          actor:
            type: string
            description: Login actor (typically github-actions)
        required: [type, token]

      - description: AWS ECR with static IAM credentials
        additionalProperties: false
        properties:
          type:
            type: string
            const: aws-ecr
          region:
            type: string
            description: AWS region (e.g. us-east-1)
          accessKeyIdSecret:
            type: string
            description: Credential name containing the AWS access key ID
          secretAccessKeySecret:
            type: string
            description: Credential name containing the AWS secret access key
        required: [type, region, accessKeyIdSecret, secretAccessKeySecret]

      - description: AWS ECR with GitHub Actions OIDC (no long-lived credentials)
        additionalProperties: false
        properties:
          type:
            type: string
            const: aws-ecr-github-actions-oidc
          roleArn:
            type: string
            description: IAM role ARN to assume via OIDC
          region:
            type: string
            description: AWS region (e.g. us-east-1)
          sessionName:
            type: string
            description: 'Session name for the assumed role (default: github-actions)'
        required: [type, roleArn, region]

      - description: GCP Artifact Registry with service account key
        additionalProperties: false
        properties:
          type:
            type: string
            const: gcp-gar
          serviceAccountKeySecret:
            type: string
            description: Credential name containing the GCP service account JSON key
        required: [type, serviceAccountKeySecret]

      - description: GCP Artifact Registry with GitHub Actions OIDC
        additionalProperties: false
        properties:
          type:
            type: string
            const: gcp-gar-github-actions-oidc
          workloadIdentityProvider:
            type: string
            description: Full workload identity provider resource name
          serviceAccount:
            type: string
            description: Service account email to impersonate
        required: [type, workloadIdentityProvider, serviceAccount]

      - description: Azure Container Registry with service principal credentials
        additionalProperties: false
        properties:
          type:
            type: string
            const: azure-acr
          clientIdSecret:
            type: string
            description: Credential name containing the Azure client ID
          clientSecretSecret:
            type: string
            description: Credential name containing the Azure client secret
          tenantIdSecret:
            type: string
            description: Credential name containing the Azure tenant ID
        required: [type, clientIdSecret, clientSecretSecret, tenantIdSecret]

      - description: Azure Container Registry with GitHub Actions OIDC
        additionalProperties: false
        properties:
          type:
            type: string
            const: azure-acr-github-actions-oidc
          clientId:
            type: string
            description: Azure application (client) ID
          tenantId:
            type: string
            description: Azure directory (tenant) ID
          subscriptionId:
            type: string
            description: Azure subscription ID
        required: [type, clientId, tenantId, subscriptionId]

  pushTarget:
    type: object
    additionalProperties: false
    required: [registry]
    description: Additional registry to push the built image to
    properties:
      registry:
        $ref: "#/$defs/registryDomain"
        description: Target registry domain
      namespace:
        $ref: "#/$defs/registryNamespace"
        description: >
          Target namespace/organisation (default: matches primary push).
          Supports nested paths, but no leading/trailing slashes.

  probeConfig:
    type: object
    additionalProperties: false
    description: Kubernetes health probe configuration
    properties:
      checkType:
        type: string
        enum: [http-get, tcp-socket, exec, grpc]
        description: 'Probe mechanism (default: http-get)'
      httpPath:
        type: string
        description: HTTP path for http-get probes
      httpScheme:
        type: string
        enum: [HTTP, HTTPS]
        description: 'HTTP scheme for http-get probes (default: HTTP)'
      tcpPort:
        oneOf:
          - type: integer
            minimum: 1
            maximum: 65535
          - type: string
            pattern: "^([1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
        description: TCP port for tcp-socket probes
      execCommand:
        type: string
        description: Command for exec probes
      grpcPort:
        oneOf:
          - type: integer
            minimum: 1
            maximum: 65535
          - type: string
            pattern: "^([1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
        description: gRPC port for grpc probes
      grpcService:
        type: string
        description: gRPC service name for grpc probes
      initialDelaySeconds:
        oneOf:
          - type: integer
            minimum: 0
          - type: string
            pattern: "^[0-9]+$"
        description: Seconds after container start before first probe
      periodSeconds:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            pattern: "^[1-9][0-9]*$"
        description: How often to perform the probe in seconds
      timeoutSeconds:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            pattern: "^[1-9][0-9]*$"
        description: Seconds after which the probe times out
      failureThreshold:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            pattern: "^[1-9][0-9]*$"
        description: Consecutive failures before the probe is considered failed
      successThreshold:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            pattern: "^[1-9][0-9]*$"
        description: Consecutive successes before the probe is considered successful
      terminationGracePeriodSeconds:
        oneOf:
          - type: integer
            minimum: 0
          - type: string
            pattern: "^[0-9]+$"
        description: Grace period override for pod termination on probe failure
